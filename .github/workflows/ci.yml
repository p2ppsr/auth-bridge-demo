name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build backend
        run: |
          cd packages/auth-bridge-express
          npm ci --ignore-scripts
          npm run build
          cd ../../backend
          npm ci --ignore-scripts
          npm run build
      - name: Build frontend
        run: |
          cd packages/auth-bridge-react
          npm ci --ignore-scripts
          npm run build
          cd ../../frontend
          npm ci --ignore-scripts
          npm run build
