apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-bridge-prod
resources:
  - ../../base
configMapGenerator:
  - name: auth-bridge-config
    behavior: replace
    literals:
      - NODE_ENV=production
      - PORT=8080
      - BSV_CHAIN=main
      - STORAGE_URL=http://wallet-storage.wallet-storage-prod.svc.cluster.local:8080
      - FRONTEND_URL=https://auth-bridge.babbage.systems
      - AUTH_BASE_URL=https://auth-bridge-api.babbage.systems/auth
      - BACKEND_HOST=auth-bridge-backend
      - BACKEND_PORT=8080
images:
  - name: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/auth-bridge-backend
    newName: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/auth-bridge-backend
    newTag: latest
  - name: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/auth-bridge-frontend
    newName: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/auth-bridge-frontend
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: auth-bridge-frontend
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth-bridge.babbage.systems
      - op: replace
        path: /spec/rules/0/host
        value: auth-bridge.babbage.systems
  - target:
      kind: Ingress
      name: auth-bridge-backend
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth-bridge-api.babbage.systems
      - op: replace
        path: /spec/rules/0/host
        value: auth-bridge-api.babbage.systems
  - target:
      kind: Certificate
      name: auth-bridge-frontend-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: auth-bridge.babbage.systems
  - target:
      kind: Certificate
      name: auth-bridge-backend-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: auth-bridge-api.babbage.systems
  - target:
      kind: Deployment
      name: auth-bridge-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
