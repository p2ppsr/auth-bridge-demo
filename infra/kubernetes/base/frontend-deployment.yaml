apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-bridge-frontend
  labels:
    app.kubernetes.io/name: auth-bridge-frontend
    app.kubernetes.io/part-of: auth-bridge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-bridge-frontend
      app.kubernetes.io/part-of: auth-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-bridge-frontend
        app.kubernetes.io/part-of: auth-bridge
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-bridge-frontend
              app.kubernetes.io/part-of: auth-bridge
      containers:
        - name: auth-bridge-frontend
          image: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/auth-bridge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-bridge-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 18
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 10]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
