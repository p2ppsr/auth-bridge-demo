apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-bridge-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-bridge-backend
      app.kubernetes.io/part-of: auth-bridge
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-bridge-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-bridge-frontend
      app.kubernetes.io/part-of: auth-bridge
